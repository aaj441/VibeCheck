version: '3.8'

services:
  # PostgreSQL Database for development
  postgres:
    image: postgres:15-alpine
    container_name: vibe-check-db-dev
    environment:
      POSTGRES_DB: vibe_check_dev
      POSTGRES_USER: vibe_check_user
      POSTGRES_PASSWORD: vibe_check_password
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
      - ./database/migrations:/docker-entrypoint-initdb.d
    ports:
      - "5432:5432"
    networks:
      - vibe-check-dev-network

  # Redis for development
  redis:
    image: redis:7-alpine
    container_name: vibe-check-redis-dev
    ports:
      - "6379:6379"
    volumes:
      - redis_dev_data:/data
    networks:
      - vibe-check-dev-network

volumes:
  postgres_dev_data:
  redis_dev_data:

networks:
  vibe-check-dev-network:
    driver: bridge