version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: vibe-check-db
    environment:
      POSTGRES_DB: vibe_check
      POSTGRES_USER: vibe_check_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-vibe_check_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/migrations:/docker-entrypoint-initdb.d
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vibe_check_user -d vibe_check"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - vibe-check-network

  # Redis for caching and sessions
  redis:
    image: redis:7-alpine
    container_name: vibe-check-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - vibe-check-network

  # Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: vibe-check-backend
    environment:
      NODE_ENV: production
      PORT: 3001
      DATABASE_URL: postgresql://vibe_check_user:${POSTGRES_PASSWORD:-vibe_check_password}@postgres:5432/vibe_check
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:-your-jwt-secret-here}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      LASTFM_API_KEY: ${LASTFM_API_KEY}
      SPOTIFY_CLIENT_ID: ${SPOTIFY_CLIENT_ID}
      SPOTIFY_CLIENT_SECRET: ${SPOTIFY_CLIENT_SECRET}
    ports:
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - vibe-check-network

  # Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: vibe-check-frontend
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: http://localhost:3001
      NEXT_PUBLIC_WS_URL: http://localhost:3001
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - vibe-check-network

  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: vibe-check-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./nginx/ssl:/etc/nginx/ssl
    depends_on:
      - frontend
      - backend
    networks:
      - vibe-check-network

volumes:
  postgres_data:
  redis_data:

networks:
  vibe-check-network:
    driver: bridge